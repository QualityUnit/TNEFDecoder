name: pinact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/**
      - .github/actions/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinact:
    name: Enforce SHA-pinning of third-party actions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Check third-party actions are pinned to commit SHAs
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          excludes: |
            ^actions/
            ^github/
            ^QualityUnit/
